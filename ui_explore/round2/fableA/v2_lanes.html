<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lanes A Draft Room</title>
<meta name="description" content="Round 2, v2 — four position lanes in the lineup's fixed order, the focused lane widened into a three-name comparison, and no rail at all: the wait is one sentence.">
<style>
/* Obsidian — design_system.TOKENS verbatim. Colour is settled and is not a variable this round. */
:root{
  --bg:#15120b; --surface:#1f1a11; --surface-2:#1a1610; --line:#2c2517; --line-2:#3f3522;
  --ink:#ece3d2; --muted:#a79a83; --dim:#776d5a;
  --emerald:#1a9e4b; --emerald-b:#4ee08c; --gold:#d4a017; --gold-b:#f7cf4a;
  --violet:#9457d4; --violet-b:#c9a4f0; --crimson:#b0193c; --crimson-b:#ff6b85;
  --sky:#1466c4; --sky-b:#6fb2f7; --amber:#e07b0a; --amber-b:#f9a828;
  --cliff:#0d9488; --cliff-b:#3ad9c8; --block:#c2410c; --block-b:#f9a05c;
  --pure:#e2d8c3; --tie:#7b7059; --tie-b:#a99d84;
  --qb:#8f86f0; --rb:#17bfa0; --wr:#4aa8ef; --te:#e8683f; --k:#a09480; --def:#ef7fc0;
  --f-d:"Cinzel",Georgia,serif; --f-s:"Segoe UI",system-ui,sans-serif;
  --f-m:"JetBrains Mono","DejaVu Sans Mono",monospace; --r:2px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-s);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:none;padding:0}
b{font-weight:600}
small{font-size:max(12px,.85em)}
:focus{outline:none} :focus-visible{outline:2px solid var(--gold-b);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}

/* 12px floor: nothing resident below .75rem. */
.k{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;white-space:nowrap}
.note{font-size:.78rem;color:var(--dim);line-height:1.45}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}

/* the page is the room */
.room{height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--surface-2)}

/* review bar — the variant tag, the state switcher, the hypothesis toggle. Not part of the product. */
.rev{display:flex;align-items:center;gap:12px;padding:6px 16px;background:#0f0d08;border-bottom:1px solid var(--line-2);font-size:.8rem;color:var(--muted);flex:0 0 auto}
.rev .tag{font-family:var(--f-m);color:var(--gold-b);font-weight:700;letter-spacing:.06em}
.rev .states{display:flex;gap:4px;margin-left:8px}
.rev .states button{font-family:var(--f-m);font-size:.78rem;padding:.14rem .55rem;border:1px solid var(--line-2);border-radius:var(--r);color:var(--muted)}
.rev .states button[aria-pressed="true"]{background:var(--gold-b);border-color:var(--gold-b);color:#15120b}
.rev .hyp{margin-left:auto;border:1px solid var(--line-2);border-radius:var(--r);padding:.14rem .5rem;color:var(--muted)}
.rev .hyp[aria-expanded="true"]{color:var(--ink);border-color:var(--dim)}
.hypbox{padding:8px 16px;border-bottom:1px solid var(--line-2);background:#0f0d08;font-size:.84rem;color:var(--muted);line-height:1.5;flex:0 0 auto}
.hypbox b{color:var(--ink)} .hypbox[hidden]{display:none}

/* header */
.hdr{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line-2);flex:0 0 auto}
.wm{font-family:var(--f-d);font-weight:700;letter-spacing:.1em;color:var(--gold-b);text-transform:uppercase;font-size:1rem}
.lg{font-size:.86rem;color:var(--muted)} .lg b{color:var(--ink)}
.hdr .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line-2);border-radius:var(--r);padding:.34rem .66rem;color:var(--muted);background:var(--surface-2);font-size:.84rem;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--dim)}
.btn[aria-expanded="true"]{background:var(--gold-b);border-color:var(--gold-b);color:#15120b}
.btn.paid{border-style:dashed;border-color:var(--violet)} .btn.paid:hover{color:var(--violet-b)}
.btn.sm{padding:.18rem .5rem;font-size:.78rem}

/* the clock line */
.clk{display:flex;align-items:center;gap:18px;padding:7px 16px;border-bottom:1px solid var(--line-2);background:var(--surface);flex:0 0 auto;font-size:.88rem;color:var(--muted)}
.clk b{color:var(--ink)}
.timer{font-family:var(--f-m);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;display:flex;align-items:baseline;gap:8px}
.timer small{font-size:.75rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-family:var(--f-s);font-weight:700}
.upnow{font-family:var(--f-d);font-size:1.02rem;font-weight:700;letter-spacing:.05em;color:var(--gold-b);white-space:nowrap}
.clk .right{margin-left:auto;display:flex;gap:14px;align-items:center}

/* atoms */
.pill{font-family:var(--f-m);font-size:.75rem;font-weight:700;padding:.06rem .3rem;border-radius:2px;color:#15120b;flex:0 0 auto;line-height:1.3}
.face{width:44px;height:44px;flex:0 0 auto;border-radius:3px;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-m);font-size:.9rem;font-weight:700;color:var(--muted);position:relative;overflow:hidden}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face.lg{width:60px;height:60px;font-size:1.15rem} .face.sm{width:28px;height:28px;font-size:.75rem;border-radius:2px}
.face[data-pos]{box-shadow:inset 0 -3px 0 var(--pc)}
.inj{color:var(--amber-b);font-style:normal}
.gap{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.gap.neg{color:var(--ink)} .gap.pos{color:var(--emerald-b)} .gap.zero{color:var(--muted)}
.copy{font-family:var(--f-m);font-size:.75rem;color:var(--muted);border:1px solid var(--line-2);border-radius:var(--r);padding:.22rem .5rem;white-space:nowrap}
.copy:hover{color:var(--ink);border-color:var(--dim)}
.wh{font-family:var(--f-m);font-size:.75rem;font-weight:700;color:var(--violet-b);border:1px solid var(--violet);border-radius:2px;padding:0 .3rem;text-transform:uppercase}

/* roster strip — the slot the subject would fill is lit (the owner liked this on Ledger B) */
.slots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.slotc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:var(--r);padding:.2rem .5rem;font-size:.8rem;background:var(--surface-2);white-space:nowrap}
.slotc .s{font-family:var(--f-m);font-size:.75rem;color:var(--dim)}
.slotc.open{border-style:dashed;color:var(--dim)}
.slotc.open.need{border-color:var(--amber);color:var(--amber-b)} .slotc.open.need .s{color:var(--amber-b)}
.slotc.fills{border-style:solid;border-color:var(--gold-b);color:var(--gold-b);background:rgba(212,160,23,.1);box-shadow:0 0 0 1px rgba(247,207,74,.25)}
.slotc.fills .s{color:var(--gold-b)}
/* vertical roster column variant */
.rcol .slot{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.rcol .slot:last-child{border:none}
.rcol .slot .s{font-family:var(--f-m);font-size:.75rem;color:var(--dim);width:38px;flex:0 0 auto}
.rcol .slot .p{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcol .slot.open .p{color:var(--dim);font-style:italic}
.rcol .slot.open.need .s,.rcol .slot.open.need .p{color:var(--amber-b);font-style:normal}
.rcol .slot.fills{background:rgba(212,160,23,.08);outline:1px solid var(--gold);outline-offset:-1px;border-radius:2px}
.rcol .slot.fills .p{color:var(--gold-b);font-style:normal;font-weight:600}

/* RAIL A — named past + marked span (the free finding). No scroll: the past is clipped on the left. */
.railA{display:flex;align-items:stretch;gap:5px;padding:7px 16px 8px;border-bottom:1px solid var(--line-2);background:var(--surface-2);flex:0 0 auto}
.railA .past{flex:1 1 auto;min-width:0;display:flex;flex-direction:row-reverse;flex-wrap:wrap;justify-content:flex-start;align-content:flex-start;gap:5px;overflow:hidden}
.pk{flex:0 0 auto;width:118px;border:1px solid var(--line);background:var(--surface);padding:5px 8px;border-radius:var(--r);user-select:none;min-width:0}
.pk .c{font-family:var(--f-m);font-size:.75rem;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:4px}
.pk .nm{font-size:.8rem;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .sd{font-size:.75rem;color:var(--dim);margin-top:0}
.pk.mine{border-color:var(--gold);box-shadow:0 0 0 1px rgba(212,160,23,.25)} .pk.mine .sd{color:var(--gold-b)}
.pk.now{border-color:var(--gold-b);box-shadow:0 0 14px rgba(247,207,74,.3);width:126px} .pk.now .nm{color:var(--gold-b)}
.pk.next{border-style:dashed;border-color:var(--gold-b);width:126px} .pk.next .nm{color:var(--gold-b)}
.span{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px 10px;border:1px dashed var(--line-2);border-radius:var(--r);min-width:230px}
.span .t{font-size:.8rem;color:var(--muted);white-space:nowrap} .span .t b{color:var(--ink)}
.ticks{display:flex;gap:3px;align-items:flex-end}
.ticks i{display:block;width:12px;height:10px;border-radius:1px;background:var(--line-2);border-bottom:2px solid var(--dim)}
.ticks .g{width:7px}
.span .seats{font-size:.75rem;color:var(--dim);white-space:nowrap}

/* RAIL B — boxes both directions, compact between-boxes, anchored so now → next is on screen */
.railB{position:relative;padding:7px 16px 8px;border-bottom:1px solid var(--line-2);background:var(--surface-2);flex:0 0 auto}
.railB .scroll{overflow-x:auto;scrollbar-width:none;cursor:grab;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 96%,transparent)}
.railB .scroll::-webkit-scrollbar{display:none}
.railB .track{display:flex;gap:5px;padding:1px 0;width:max-content}
.pk.between{width:36px;padding:5px 3px;border-color:var(--line-2);text-align:center;display:flex;align-items:center;justify-content:center}
.pk.between .sd{font-weight:600;color:var(--muted);margin:0}
.pk.future{width:36px;padding:5px 3px;border-style:dotted;opacity:.55;text-align:center;display:flex;align-items:center;justify-content:center} .pk.future .sd{margin:0}
.pk.dimmed{opacity:.5}
.railB .nav{position:absolute;right:16px;top:-28px;display:flex;gap:6px}

/* ticks only (span, no boxes) */
.spanline{display:flex;align-items:center;gap:12px;font-size:.84rem;color:var(--muted)} .spanline b{color:var(--ink)}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim[data-open="1"]{opacity:1;pointer-events:auto}
.sheet{position:absolute;background:var(--surface);border:1px solid var(--line-2);z-index:30;display:flex;flex-direction:column;transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.6)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sheet .sh .t{font-family:var(--f-d);font-size:1rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sheet .sh .x{margin-left:auto;border:1px solid var(--line-2);border-radius:var(--r);padding:.22rem .6rem;color:var(--muted);font-size:.84rem}
.sheet .sh .x:hover{color:var(--ink)}
.sheet .sc{overflow:auto;padding:13px 15px;flex:1 1 auto;min-height:0}
.sheet.left{left:0;top:0;bottom:0;width:min(620px,86%);transform:translateX(-101%)}
.sheet.right{right:0;top:0;bottom:0;width:min(520px,60%);transform:translateX(101%)}
.sheet.top{left:0;right:0;top:0;bottom:0;transform:translateY(-101%)}
.sheet.bottom{left:0;right:0;bottom:0;height:min(420px,70%);transform:translateY(101%)}
.sheet[data-open="1"]{transform:none}
.rosterGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:9px 12px}
.rcard h4{margin:0 0 6px;font-size:.86rem;font-weight:700;display:flex;gap:7px;align-items:baseline;white-space:nowrap} .rcard h4 .note{margin-left:auto;white-space:normal;text-align:right}
.rcard.me h4{color:var(--gold-b)}
.rcard .ln{font-size:.82rem;display:flex;gap:7px;padding:2px 0;align-items:center} .rcard .ln .n{min-width:0}
.rcard.soon{border-color:var(--line-2);background:var(--surface)}
.rcard .sg{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;margin:2px 0 4px}
.rcard .sl{display:flex;gap:6px;align-items:center;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .sl i{font-style:normal;font-family:var(--f-m);font-size:.75rem;color:var(--dim);width:34px;flex:0 0 auto}
.rcard .sl.open{color:var(--dim);font-style:italic} .rcard .sl.fits{color:var(--amber-b);font-style:normal}
.rcard .ln b{color:var(--ink)}
.dbgrid{display:grid;gap:3px;min-width:760px}
.dbh{font-family:var(--f-m);font-size:.75rem;color:var(--dim);text-align:center;padding:3px 0;align-self:center}
.dbc{border:1px solid var(--line);background:var(--surface-2);padding:4px 5px;min-height:36px;border-radius:2px;font-size:.75rem;line-height:1.25}
.dbc.mine{border-color:var(--gold);background:rgba(212,160,23,.07)} .dbc.future{opacity:.35} .dbc.now{opacity:1;border-color:var(--gold-b)}
.dbc .p{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block} .dbc .q{font-family:var(--f-m);color:var(--dim)}
.chair{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;background:var(--surface-2)}
.chair .who{font-family:var(--f-m);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.chair p{margin:0;font-size:.9rem;line-height:1.55;color:var(--muted)} .chair.empty{border-style:dashed} .chair.empty p{font-style:italic}

/* the engine's working — hidden until asked; every number with its kind */
.ev{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.ev:last-child{border:none}
.ev .el{color:var(--muted)} .ev .en{font-family:var(--f-m);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.ev .eb{grid-column:1/-1;font-size:.78rem;color:var(--dim);line-height:1.45}
.ek{font-style:normal;font-family:var(--f-m);font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.04rem .3rem;border-radius:2px;border:1px solid var(--line-2);color:var(--muted);margin-right:4px}
.ev.withheld .en,.ev.withheld .ek{color:var(--violet-b);border-color:var(--violet)}
.ev.unmeasured .ek,.ev.not_priced .ek{color:var(--amber-b);border-color:var(--amber)}
.ev.count .ek{color:var(--sky-b);border-color:var(--sky)}

/* alternatives — "what else, at what cost" as rows */
.alts{display:flex;flex-direction:column}
.alt{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:2px;min-height:38px}
.alt:last-child{border-bottom:none}
.alt:hover{background:var(--surface)}
.alt .nm{min-width:0;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alt .nm small{color:var(--dim);font-weight:400;font-size:.78rem;margin-left:6px}
.alt .cost{display:flex;gap:14px;align-items:baseline;white-space:nowrap}
.cc{display:inline-flex;align-items:baseline;gap:5px}
.cc .ck{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.cc .cv{font-family:var(--f-m);font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.cc.fav .cv{color:var(--amber-b)} .cc.fav .ck{color:var(--amber-b)}
.disp{display:block;color:var(--amber-b);font-size:.9rem;line-height:1.45;margin-top:4px} .disp b{color:var(--amber-b)}
[data-list]{position:relative}
.more{font-size:.78rem;color:var(--muted);padding:3px 8px 0;flex:0 0 auto}
.more[hidden]{display:none}
.fade{-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent)}

/* candidate strip (harvested from Gauntlet): constant 34px rows */
.strip{display:flex;flex-direction:column;min-height:0}
.strip .sh2{display:flex;align-items:center;gap:10px;padding:0 0 5px}
.strip .sh2 .filt{margin-left:auto;display:flex;gap:4px}
.filt button{font-family:var(--f-m);font-size:.75rem;padding:.12rem .45rem;border:1px solid var(--line-2);border-radius:var(--r);color:var(--muted)}
.filt button[aria-pressed="true"]{background:var(--gold-b);border-color:var(--gold-b);color:#15120b}
.strip .list{overflow-y:auto;min-height:0;flex:1 1 auto;scrollbar-width:thin}
.strip .sh2 .more{margin-left:auto;padding:0}
.row{display:grid;grid-template-columns:24px 30px auto minmax(0,1fr) auto auto;gap:9px;align-items:center;height:32px;padding:0 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.86rem}
.row:hover{background:var(--surface)} .row[aria-selected="true"]{box-shadow:inset 2px 0 0 var(--gold-b);background:var(--surface)}
.row .rk{font-family:var(--f-m);font-size:.75rem;color:var(--dim)}
.row .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .nm small{color:var(--dim);font-weight:400;font-size:.78rem;margin-left:6px}
.row .tk{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:left}
.row .tk i{font-style:normal;color:var(--dim)}
.row .v{font-family:var(--f-m);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v small{font-weight:400;color:var(--dim);font-size:.75rem;margin-left:5px;font-family:var(--f-s)}

/* prose */
p.say{margin:0;font-size:.9rem;line-height:1.5;color:var(--muted)} p.say b{color:var(--ink)} p.say+p.say{margin-top:4px}
p.say .rule{color:var(--dim);font-size:.8rem}
.a{color:var(--gold-b);font-weight:600} .b{color:var(--pure);font-weight:600} .c3{color:var(--crimson-b);font-weight:600}
.lead-name{font-family:var(--f-d);font-size:1.5rem;font-weight:700;line-height:1.05}
.sub{font-size:.84rem;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--f-m);font-size:1.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.u{display:block;font-size:.75rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:3px;white-space:nowrap}

/* §14 tank — vertical, one per door, spans the position's whole priced pool, starter line inside,
   no bands. Width is the door's height so every priced player resolves to at least a pixel. */
.tank{position:relative;width:12px;border:1px solid var(--line-2);border-radius:2px;background:var(--surface-2);overflow:hidden;flex:0 0 auto;align-self:stretch}
.tank .fill{position:absolute;left:0;right:0;bottom:0;background:var(--dim)}
.tank .fill.st{background:var(--emerald)}
.tank .mark{position:absolute;left:-1px;right:-1px;height:2px;background:var(--ink);z-index:2}
.tankcap{font-size:.75rem;color:var(--dim);line-height:1.3}
.tankcap b{color:var(--muted);font-weight:600}
.tankcap .gone{color:var(--amber-b)}
.lineup{display:flex;align-items:center;gap:10px;padding:6px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--surface-2)}

/* v2 — LANES, no rail. Position layer PERSISTENT in STABLE lineup order (contents change, columns
   never move) · the lanes ARE the pool · within-position comparison ALWAYS ON inside the focused
   lane · NO RAIL — the wait is a sentence in the clock line. */
.lineup{display:flex;align-items:center;gap:10px;padding:7px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--surface-2)}
.lanes{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);gap:0;transition:grid-template-columns .25s ease}
/* one cross-lane statement: the board's order, read across the lanes */
.order{display:flex;align-items:center;gap:10px;padding:7px 16px;border-bottom:1px solid var(--line-2);background:var(--surface);font-size:.88rem;color:var(--muted);flex:0 0 auto;flex-wrap:wrap}
.order .k{flex:0 0 auto}
.order .seq{display:inline-flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.order .seq span{display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.order .seq i{font-style:normal;font-family:var(--f-m);font-weight:700;color:var(--gold-b)}
.order .seq b{color:var(--ink)} .order .seq .d{font-family:var(--f-m);color:var(--dim)}
.order .rule{color:var(--muted)}
/* within a lane: the board rank is the first thing on every row */
.rank{font-family:var(--f-m);font-weight:700;color:var(--gold-b);font-size:.95rem;flex:0 0 auto}
.rank.dim{color:var(--muted)}
.lead1 .who .rank{font-size:1.15rem;min-width:30px}
.rr .nm .rank{display:inline-block;min-width:28px;font-size:.84rem}
.lane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);cursor:pointer}
.lane:last-child{border-right:none}
.lane.focus{cursor:default;background:linear-gradient(180deg,rgba(212,160,23,.06),transparent 30%)}
.lh{padding:9px 14px 8px;border-bottom:1px solid var(--line);flex:0 0 auto}
.lh .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lh .pos{font-family:var(--f-d);font-size:1.1rem;font-weight:700}
.lh .st{font-size:.8rem;color:var(--muted)} .lh .st.need{color:var(--amber-b)}
.lh .first{margin-left:auto;font-family:var(--f-m);font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--gold-b);border:1px solid var(--gold);border-radius:var(--r);padding:.08rem .4rem;white-space:nowrap}
.lh .cost{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.4}
.lh .cost b{font-family:var(--f-m);color:var(--ink);font-weight:600}
.lh .cost .w{color:var(--dim)}
.lead1{padding:9px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.lead1 .who{display:flex;align-items:center;gap:10px}
.lead1 .nm{font-weight:700;font-size:1.05rem;line-height:1.15}
.lead1 .sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.lead1 .valrow{display:flex;align-items:baseline;gap:8px;margin-top:5px}
.lead1 .valrow .big{font-size:1.2rem}
.lead1 .valrow .u{margin:0}
.lead1 .vs{margin:7px 0 0;font-size:.84rem;color:var(--muted);line-height:1.45} .lead1 .vs b{color:var(--ink)}
.lead1 .vs .fav{color:var(--amber-b)}
.lead1 .cost{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.rest{overflow-y:auto;min-height:0;flex:1 1 auto;scrollbar-width:thin}
.lane .more{border-top:1px solid var(--line);padding:4px 14px}
.lane.none{flex:0 0 auto}
.rr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line);font-size:.86rem;cursor:pointer}
.rr:hover{background:var(--surface)}
.rr .nm{min-width:0;font-weight:600;line-height:1.3}
.rr .nm small{color:var(--dim);font-weight:400;font-size:.78rem;margin-left:5px}
.rr .v{font-family:var(--f-m);font-weight:600;font-variant-numeric:tabular-nums}
.rr .cue{grid-column:1/-1;font-size:.78rem;color:var(--dim)}
.rr[aria-selected="true"]{box-shadow:inset 2px 0 0 var(--gold-b)}
.empty{padding:12px 14px;color:var(--dim);font-size:.86rem;line-height:1.5}
/* the focused lane's always-on comparison: columns are names, rows are what differs */
.trio{flex:0 0 auto;border-bottom:1px solid var(--line);padding:8px 14px 10px}
.trio .k{display:block;margin-bottom:6px;white-space:normal}
.trio .k .note{text-transform:none;letter-spacing:0;font-weight:400}
.tg{display:grid;gap:0 10px;font-size:.84rem}
.tg .hd{display:flex;align-items:center;gap:8px;padding:0 0 6px;min-width:0;border-bottom:1px solid var(--line-2)}
.tg .hd .nm{font-weight:700;min-width:0;font-size:.9rem;line-height:1.2}
.tg .hd .nm small{display:block;color:var(--dim);font-weight:400;font-size:.75rem}
.tg .rl{color:var(--dim);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 0 3px;border-bottom:1px solid var(--line);white-space:normal;line-height:1.3}
.tg .cell{padding:5px 0 3px;border-bottom:1px solid var(--line);min-width:0;color:var(--muted);line-height:1.35}
.tg .cell b{color:var(--ink)} .tg .cell .mono{color:var(--ink)}
.tg .cell.lead{color:var(--ink)}
.tg .cell .swap{font-size:.75rem;color:var(--dim);border:1px solid var(--line-2);border-radius:2px;padding:0 .35rem;margin-left:4px}
.tg .cell .swap:hover{color:var(--ink)}
.lane .foot{display:flex;gap:6px;align-items:center;padding:6px 14px;border-top:1px solid var(--line);flex:0 0 auto}

const STATE_KEYS = ["early", "mid", "late"];
const num = x => typeof x === "number" && isFinite(x);
const f1  = x => num(x) ? (Math.abs(x) < 0.05 ? "0.0" : x.toFixed(1).replace("-", "−")) : "—";
const sgn = x => num(x) ? (Math.abs(x) < 0.05 ? "±0.0" : (x > 0 ? "+" : "−") + Math.abs(x).toFixed(1)) : "—";
const pad = n => String(n).padStart(2, "0");
const pc  = p => `var(--${(p || "k").toLowerCase()})`;
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const POS  = {QB:"quarterback", RB:"running back", WR:"receiver", TE:"tight end", K:"kicker", DEF:"defense"};
const PLUR = {QB:"quarterbacks", RB:"running backs", WR:"receivers", TE:"tight ends", K:"kickers", DEF:"defenses"};
const TIER_WORD = {HIGH:"a sharp drop", MEDIUM:"a moderate drop", LOW:"no cliff"};
const FLEXIBLE = new Set(["RB", "WR", "TE"]);
const ORD = ["", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth"];
/* engine labels, verbatim (lineup_optimizer.EXPOSURE_BASIS_LABELS / DISPLACEMENT_BASIS_LABELS,
   draft_strategy.DENIAL_BASIS_LABELS). The client never paraphrases a basis. */
const DEPTH_LABEL = {
  measured: "measured against your own lineup",
  roster_partial: "not charged -- a player you drafted could not be priced, so a spare who may cover this position was left out of the solve and the exposure it measured is NOT the 0.0 shown here",
  vacant: "not measured -- you hold no starter at this position to insure",
  no_surplus: "measured, but it is a starter's whole value rather than a backup's job -- some starter here has no cover, so this is not a depth price and is not charged as one",
  not_applicable: "not measured -- this position has no startable slot in this league",
};
const DISP_LABEL = {
  measured: "measured against your own starters",
  roster_partial: "a floor -- a player you drafted could not be priced, so a slot he may hold reads as open",
  not_applicable: "not measured -- this position has no startable slot in this league",
  no_points_anchor: "not measured -- this position has no replacement level in projected points here",
};
const DENIAL_LABEL = {
  no_intervening_rival: "no rival had a pick before your next turn",
  no_rival_priced: "no rival's board could price him, so nothing was measured",
  measured: "measured against every rival board that could price him",
};

/* roster: greedy fill of the league's slots from a list of picks */
function slotRoster(picks, slots){
  const left = picks.slice();
  return slots.map(slot => {
    let i = left.findIndex(p => p.pos === slot);
    if (i < 0 && slot === "FLEX") i = left.findIndex(p => FLEXIBLE.has(p.pos));
    if (i < 0 && slot === "BN")   i = left.length ? 0 : -1;
    return {slot, p: i < 0 ? null : left.splice(i, 1)[0]};
  });
}

function buildModel(key){
  const S = DATA.states[key], RAIL = DATA.rail;
  const C = S.candidates.slice().sort((a, b) => a.rank - b.rank);
  const M = {key, S, C, RAIL};

  /* ---- turn geometry, read off the rail (pick_order) ---- */
  M.NOW_NO = S.consumed + 1;
  M.KNOWN = RAIL.filter(p => p.no <= S.consumed);
  const MINE = RAIL.filter(p => p.mine).map(p => p.no);
  M.NEXT_NO = MINE.find(n => n > M.NOW_NO) || null;
  M.PREV_NO = [...MINE].reverse().find(n => n < M.NOW_NO) || null;
  M.BETWEEN = M.NEXT_NO ? RAIL.filter(p => p.no > M.NOW_NO && p.no < M.NEXT_NO) : [];
  console.assert(M.BETWEEN.length === S.intervening, "rail span and intervening_picks disagree");
  M.NOW_PICK = RAIL.find(p => p.no === M.NOW_NO);
  M.NEXT_PICK = M.NEXT_NO ? RAIL.find(p => p.no === M.NEXT_NO) : null;
  M.AFTER_ME = M.BETWEEN[0] || null;
  M.LAST = M.KNOWN[M.KNOWN.length - 1] || null;
  M.coord = p => `${p.rnd}.${pad(p.inr)}`;
  M.nextLabel = M.NEXT_PICK ? M.coord(M.NEXT_PICK) : "—";
  const SEAT_TURNS = {}; M.BETWEEN.forEach(p => SEAT_TURNS[p.seat] = (SEAT_TURNS[p.seat] || 0) + 1);
  M.seatsText = () => {
    const seats = Object.keys(SEAT_TURNS), twice = seats.filter(s => SEAT_TURNS[s] > 1), once = seats.filter(s => SEAT_TURNS[s] === 1), parts = [];
    if (twice.length) parts.push(`rosters ${twice.join(", ")} each pick twice`);
    if (once.length) parts.push(`roster${once.length > 1 ? "s" : ""} ${once.join(", ")} pick${once.length > 1 ? "" : "s"} once`);
    return parts.join("; ");
  };
  M.waitShort = () => `Next turn <b>${M.nextLabel}</b> (#${M.NEXT_NO}) · <b>${S.intervening} picks</b> away`;
  M.waitText = () => `You pick again at <b>${M.nextLabel}</b> (#${M.NEXT_NO}), after <b>${S.intervening} picks</b> — ${M.seatsText()}.`;
  /* §1: who is on the clock is never ambiguous, with or without a rail */
  M.clockShort = () => `next up: <b>Roster ${M.AFTER_ME ? M.AFTER_ME.seat : "—"}</b>${M.LAST ? ` · last taken: <b>${M.short(M.LAST.name)}</b> (Roster ${M.LAST.seat})` : ""}`;
  M.clockText = () => `On the clock: <b>you</b> (Roster ${S.seat}) · next up: Roster ${M.AFTER_ME ? M.AFTER_ME.seat : "—"}${M.LAST ? ` · last taken: <b>${M.short(M.LAST.name)}</b> by Roster ${M.LAST.seat}` : " · first pick of the draft"}`;

  /* ---- names: the family name is the collision key ("Brown" for Amon-Ra St. Brown, A.J. Brown
          and Chase Brown); a collision keeps the particle: A. St. Brown / A. Brown / C. Brown; if
          initial + surname still collides, the full name is used ---- */
  const parts = n => { const w = (n || "").split(" "); const particle = w.length >= 3 && /^(St\.|Van|De|Da|Di|La|Le|Del|Von)$/i.test(w[w.length - 2]);
    return {first: w[0], family: w[w.length - 1], surname: particle ? w.slice(-2).join(" ") : w[w.length - 1], multi: w.length > 1}; };
  const FAM = {}, INIT = {};
  new Set([...M.KNOWN.map(p => p.name), ...C.map(c => c.name)]).forEach(n => { const q = parts(n); FAM[q.family] = (FAM[q.family] || 0) + 1; const k = q.first[0] + ". " + q.surname; INIT[k] = (INIT[k] || 0) + 1; });
  M.short = n => { const q = parts(n); if (!q.multi || FAM[q.family] <= 1) return q.surname; const k = q.first[0] + ". " + q.surname; return INIT[k] <= 1 ? k : n; };
  const short = M.short;

  /* ---- my roster ---- */
  M.ROSTER = slotRoster(S.myPicks, S.slots);
  M.STARTERS = M.ROSTER.filter(r => r.slot !== "BN");
  M.heldAt = pos => S.myPicks.filter(p => p.pos === pos);
  M.openAt = pos => M.STARTERS.filter(r => r.slot === pos && !r.p).length;
  M.openFlex = M.STARTERS.filter(r => r.slot === "FLEX" && !r.p).length;
  M.startersFull = M.STARTERS.every(r => r.p);
  M.benchFilled = M.ROSTER.filter(r => r.slot === "BN" && r.p).length;
  M.benchTotal = M.ROSTER.filter(r => r.slot === "BN").length;
  M.slotFor = c => {
    const held = M.heldAt(c.position), want = M.STARTERS.filter(r => r.slot === c.position).length;
    if (M.openAt(c.position) > 0) return held.length === 0 ? {kind:"vacant", slot:want > 1 ? c.position + "1" : c.position} : {kind:"second", slot:c.position + (held.length + 1), beside:held[0]};
    if (M.openFlex > 0 && FLEXIBLE.has(c.position)) return {kind:"flex", slot:"FLEX", holder:held[0] || null};
    return {kind:"bench", slot:"BN", holder:held[0] || null};
  };
  M.slotPhrase = c => { const s = M.slotFor(c);
    if (s.kind === "vacant") return `starts at <b>${s.slot}</b> — you hold no ${POS[c.position]}`;
    if (s.kind === "second") return `starts at <b>${s.slot}</b> beside ${short(s.beside.name)}`;
    if (s.kind === "flex")   return `starts at <b>FLEX</b>${s.holder ? ` — ${short(s.holder.name)} holds ${c.position}` : ""}`;
    return `<b>bench</b> — your starting slots are full`; };
  M.slotShort = c => { const s = M.slotFor(c); return s.kind === "bench" ? "bench" : s.slot; };
  M.rosterStrip = (c, vertical) => {
    let lit = false; const s = c ? M.slotFor(c) : null;
    const cells = M.STARTERS.map(r => {
      const fills = c && !lit && !r.p && s.kind !== "bench" && (r.slot === c.position || (s.kind === "flex" && r.slot === "FLEX")); if (fills) lit = true;
      const need = !r.p && r.slot !== "FLEX" && M.heldAt(r.slot).length === 0;
      const label = r.p ? short(r.p.name) : fills ? "← " + short(c.name) : "open";
      if (vertical) return `<div class="slot ${r.p ? "" : "open"} ${need ? "need" : ""} ${fills ? "fills" : ""}"><span class="s">${r.slot}</span><span class="p" title="${r.p ? esc(r.p.name) : ""}">${label}</span></div>`;
      return `<span class="slotc ${r.p ? "" : "open"} ${need ? "need" : ""} ${fills ? "fills" : ""}" title="${r.p ? esc(r.p.name) : ""}"><span class="s">${r.slot}</span>${label}</span>`;
    });
    const bnTxt = `${M.benchFilled} of ${M.benchTotal}${c && s.kind === "bench" ? ` · ← ${short(c.name)}` : ""}`;
    return cells.join("") + (vertical ? `<div class="slot open ${c && s.kind === "bench" ? "fills" : ""}"><span class="s">BN</span><span class="p">${bnTxt}</span></div>` : `<span class="slotc open ${c && s.kind === "bench" ? "fills" : ""}"><span class="s">BN</span>${bnTxt}</span>`);
  };

  /* ---- positions, board order (tav) and measured order (bpa) ---- */
  M.LINEUP_ORDER = [...new Set(S.slots.filter(s => s !== "BN" && s !== "FLEX"))];
  M.POSITIONS = M.LINEUP_ORDER.filter(p => C.some(c => c.position === p));
  M.atPos = pos => C.filter(c => c.position === pos);
  M.atPosBpa = pos => M.atPos(pos).slice().sort((a, b) => b.bpa - a.bpa);
  M.best = pos => M.atPos(pos)[0] || null;
  M.posRank = c => M.atPos(c.position).findIndex(x => x.player_id === c.player_id);
  M.FORFEIT = {}; M.NEXTV = {};
  C.forEach(c => { if (num(c.positional_forfeit)) M.FORFEIT[c.position] = c.positional_forfeit; if (num(c.position_next_turn_value)) M.NEXTV[c.position] = c.position_next_turn_value; });
  M.POS_BY_COST = Object.keys(M.FORFEIT).sort((a, b) => M.FORFEIT[b] - M.FORFEIT[a]);
  /* superlative scoped to the positions the board has names at (ADJ R2 §4) */
  M.costWord = pos => { const n = M.POS_BY_COST.length; if (n < 2) return "";
    const which = pos === M.POS_BY_COST[0] ? "most" : pos === M.POS_BY_COST[n - 1] ? "least" : null; if (!which) return "";
    return `${which} of ${n} measured`; };
  M.LEADER = C[0];
  M.get = id => C.find(c => c.player_id === id);
  M.VALUE_ORDER_POS = []; C.forEach(c => { if (!M.VALUE_ORDER_POS.includes(c.position)) M.VALUE_ORDER_POS.push(c.position); });

  /* ---- the cliff ---- */
  M.cliffNext = c => {
    const l = M.atPosBpa(c.position), i = l.findIndex(x => x.player_id === c.player_id), n = l[i + 1];
    if (!n || !c.positional_cliff || !num(c.positional_cliff.gap)) return null;
    return Math.abs((c.bpa - n.bpa) - c.positional_cliff.gap) < 0.02 ? n : null;
  };
  M.tierWord = c => TIER_WORD[(c.positional_cliff || {}).tier] || "no drop measured";
  M.cliffTo = c => { const n = M.cliffNext(c); return n ? `to ${short(n.name)}` : `to a player off this board (measured order)`; };
  M.cliffText = c => { const k = c.positional_cliff; if (!k || !num(k.gap)) return "no drop measured behind him";
    return `${M.tierWord(c)} behind him (${f1(k.gap)}, ${M.cliffTo(c)})`; };
  M.adjacentMeasured = (a, b) => { const l = M.atPosBpa(a.position); const ia = l.findIndex(x => x.player_id === a.player_id), ib = l.findIndex(x => x.player_id === b.player_id); return Math.abs(ia - ib) === 1 ? (ia < ib ? a : b) : null; };

  /* ---- depth: a digit only when measured; otherwise the engine's own label ---- */
  M.depth = c => c.depth_basis === "measured" ? {n:f1(c.depth_exposure), why:DEPTH_LABEL.measured} : {n:null, why:DEPTH_LABEL[c.depth_basis] || `not measured -- ${String(c.depth_basis).replace(/_/g, " ")}`};
  /* ---- displacement: the late board's negativity, named (ADJ R2 §1) ---- */
  M.displaced = c => c.displacement_basis === "measured" && num(c.displacement_adj) && Math.abs(c.displacement_adj) >= 0.05;
  M.dispSentence = c => { if (!M.displaced(c)) return "";
    const rest = c.team_acquisition_value - c.displacement_adj;
    return `<span class="disp"><b>${f1(c.displacement_adj)}</b> of this is the displacement of a starting slot you have already filled — measured against your own starters. The player himself: <b>${f1(rest)}</b>.</span>`; };
  M.dispShort = c => M.displaced(c) ? `<span class="disp">${f1(c.displacement_adj)} of it is filled-slot displacement (measured); himself ${f1(c.team_acquisition_value - c.displacement_adj)}</span>` : "";
  /* availability: the engine carried the designation and did not charge it */
  /* §14 tank, per state: the engine's latest sample at or before this pick, shown as of that pick
     (the rail reproduces the engine's drain only through #80, so the client never drains it). No bands. */
  const G = DATA.gauge || null;
  M.tank = pos => { if (!G || !num(G.opening[pos])) return null;
    const base = G.history.filter(h => h.at <= S.consumed).sort((a, b) => b.at - a.at)[0];
    const N = G.opening[pos], left = base.left[pos], starters = G.starterRank[pos];
    const startersLeft = Math.max(0, left - (N - starters));
    return {N, left, starters, startersLeft, pctLeft: Math.round(100 * left / N), sampleAt: base.at, coverage: G.coverage[pos], rows: G.rowsOnBoard[pos]}; };
  /* waiting on a position: who you get, when, what it costs — in that order */
  M.waitLine = pos => num(M.FORFEIT[pos]) ? `If you wait, the best ${POS[pos]} left at <b>#${M.NEXT_NO}</b> is worth about <b>${f1(M.NEXTV[pos])}</b> — <b>${f1(M.FORFEIT[pos])}</b> less than taking one now.` : `No next-turn value is measured for ${POS[pos]}s on this board.`;
  M.DEAREST = M.POS_BY_COST[0] || null;
  M.avail = c => c.injury_status ? `<i class="inj">${c.injury_status}</i> <span class="note">not charged</span>` : "";

  /* ============================================================================================
     compare(a, b): across positions, three real quantities — value now (the board's order), what
     each position's best is worth at your next turn, and the two-pick plan (now + next). Verified
     on this payload: forfeit(P) == tav(best at P) − next_turn(P), so plan edge == forfeit edge.
     Within a position the next-turn value is identical and says nothing; the relation rests on
     value, the measured drop, horizon, designation and depth.
     ============================================================================================ */
  M.compare = (a, b) => {
    const r = {a, b, same:a.position === b.position, dv:a.team_acquisition_value - b.team_acquisition_value};
    r.valueLeader = r.dv >= 0 ? a : b;
    if (!r.same) {
      r.hasNext = num(M.NEXTV[a.position]) && num(M.NEXTV[b.position]);
      if (r.hasNext) {
        r.aThenB = a.team_acquisition_value + M.NEXTV[b.position];   // A now, B's position at my next turn
        r.bThenA = b.team_acquisition_value + M.NEXTV[a.position];
        r.planEdge = r.aThenB - r.bThenA;                               // > 0 favours A first
        r.nextGap = M.NEXTV[a.position] - M.NEXTV[b.position];          // what remains at A's position vs B's at my next turn
        r.planLeader = r.planEdge >= 0 ? a : b;
      }
    } else {
      r.ahead = M.adjacentMeasured(a, b);
      r.dh = a.time_horizon_adj - b.time_horizon_adj;
      const da = M.depth(a), db = M.depth(b); r.depthDiff = da.n && db.n && da.n !== db.n ? [da.n, db.n] : null;
    }
    return r;
  };
  /* the sentences, from the relation. A = subject, B = the other. */
  M.whyLines = (a, b) => {
    const r = M.compare(a, b), A = `<b>${short(a.name)}</b>`, B = `<b>${short(b.name)}</b>`, out = [];
    const lead = r.dv >= 0 ? A : B, trail = r.dv >= 0 ? B : A;
    out.push(`${lead} is <b>${f1(Math.abs(r.dv))}</b> ahead of ${trail} in value to your roster now — the board's order.`);
    if (!r.same) {
      if (r.hasNext) out.push(`Wait on ${b.position} and the best ${POS[b.position]} left at your next turn is worth <b>${f1(M.NEXTV[b.position])}</b>; wait on ${a.position} and the best ${POS[a.position]} left is worth <b>${f1(M.NEXTV[a.position])}</b>. Both picks together: <b>${short(r.planLeader.name)} now</b> is the better two-pick plan by <b>${f1(Math.abs(r.planEdge))}</b>.`);
      else out.push(`No next-turn value is measured for ${!num(M.NEXTV[a.position]) ? a.position : b.position} on this board.`);
    } else {
      if (r.ahead) out.push(`They are neighbours in the order the drop was measured; between them the engine finds <b>${M.tierWord(r.ahead)}</b> (${f1(r.ahead.positional_cliff.gap)}).`);
      else out.push(`Behind ${A}: ${M.cliffText(a)}. Behind ${B}: ${M.cliffText(b)}.`);
      if (f1(a.time_horizon_adj) !== f1(b.time_horizon_adj)) out.push(`Dynasty horizon: ${sgn(a.time_horizon_adj)} on ${A}, ${sgn(b.time_horizon_adj)} on ${B}.`);
      if ((a.injury_status || null) !== (b.injury_status || null)) out.push(`${a.injury_status ? `${A} is listed ${a.injury_status}` : `${A} carries no designation`}; ${b.injury_status ? `${B} is listed ${b.injury_status}` : `${B} none`}. The designation is carried and not charged.`);
      if (r.depthDiff) out.push(`Depth insurance ${r.depthDiff[0]} against ${r.depthDiff[1]}.`);
    }
    return out;
  };
  /* a subject's own drop, said once */
  M.ownLine = c => `Behind him: ${M.tierWord(c)} (${f1(c.positional_cliff.gap)}, ${M.cliffTo(c)}).`;
  M.comparatorFor = c => c.player_id === M.LEADER.player_id ? (C[1] || null) : M.LEADER;

  /* ---- what else: the board's leader (if not him), the best at every other position, the next
          at his own position on the board ---- */
  M.alternatives = (c, max) => {
    const ids = new Set([c.player_id]), out = [];
    const push = x => { if (x && !ids.has(x.player_id)) { ids.add(x.player_id); out.push(x); } };
    push(M.LEADER);
    M.POSITIONS.filter(p => p !== c.position).forEach(p => push(M.best(p)));
    const own = M.atPos(c.position); push(own[M.posRank(c) + 1] || null);
    if (M.posRank(c) > 0) push(own[0]);
    out.sort((x, y) => y.team_acquisition_value - x.team_acquisition_value);
    return out.slice(0, max || 3);
  };
  /* the cost of taking b instead of a — three cells across positions (now · next turn · plan),
     two within (now · the drop between them) */
  M.costOf = (b, a) => {
    const r = M.compare(b, a), cells = [];
    cells.push({k:"now", v:sgn(r.dv)});
    if (!r.same) {
      if (r.hasNext) { cells.push({k:`at #${M.NEXT_NO}`, v:sgn(r.nextGap)}); cells.push({k:"both picks", v:sgn(r.planEdge), fav:r.planEdge > 0}); }
      else cells.push({k:`at #${M.NEXT_NO}`, v:"not measured"});
    } else {
      if (r.ahead) cells.push({k:"between them", v:`${M.tierWord(r.ahead)} · ${f1(r.ahead.positional_cliff.gap)}`});
      else { const l = M.atPosBpa(a.position); const n = Math.abs(l.findIndex(x => x.player_id === a.player_id) - l.findIndex(x => x.player_id === b.player_id)); cells.push({k:"measured order", v:`${n} places apart`}); }
    }
    return cells;
  };
  M.costHTML = (b, a) => M.costOf(b, a).map(c => `<span class="cc ${c.fav ? "fav" : ""}"><span class="ck">${c.k}</span><span class="cv">${c.v}</span></span>`).join("");
  M.costKey = subj => `<b>now</b> = value against ${short(subj.name)} today, the board's order · <b>at #${M.NEXT_NO}</b> = what his position leaves at your next turn against what ${subj.position} leaves · <b>both picks</b> = the two added together, him first`;

  /* ---- the engine's working (hidden until asked): every number with its kind; measured zeros print ---- */
  const KIND = {measured:"measured", count:"a count", withheld:"withheld", unmeasured:"not measured", not_charged:"not charged"};
  M.working = c => {
    const d = M.depth(c), rows = [
      {l:"Value to your roster", v:f1(c.team_acquisition_value), b:"what the board is ordered by", k:"measured"},
      {l:"Value to any roster", v:f1(c.universal_value), b:"before your roster is considered", k:"measured"},
      {l:"Credit for your open slot", v:f1(c.need_bonus), b:"what your lineup is missing where he would start", k:"measured"},
      d.n ? {l:"Depth insurance", v:d.n, b:d.why, k:"measured"} : {l:"Depth insurance", v:"—", b:d.why, k:c.depth_basis === "no_surplus" ? "not_charged" : "unmeasured"},
      c.displacement_basis === "measured" ? {l:"Lineup displacement", v:f1(c.displacement_adj), b:DISP_LABEL.measured, k:"measured"} : {l:"Lineup displacement", v:"—", b:DISP_LABEL[c.displacement_basis] || "not measured", k:"unmeasured"},
      {l:`Best ${POS[c.position]} left at your next turn`, v:num(c.position_next_turn_value) ? f1(c.position_next_turn_value) : "—", b:`what the position is expected to offer at #${M.NEXT_NO} if you wait on it`, k:num(c.position_next_turn_value) ? "measured" : "unmeasured"},
      {l:`Cost of waiting on ${c.position}`, v:num(c.positional_forfeit) ? f1(c.positional_forfeit) : "—", b:"the best now minus the best left at your next turn — an aid beside the rank, never what ranks", k:num(c.positional_forfeit) ? "measured" : "unmeasured"},
      {l:"Dynasty horizon", v:sgn(c.time_horizon_adj), b:"the age / experience term inside his value", k:"measured"},
      {l:"Projected season points", v:f1(c.projected_points), b:"season fantasy points under this league's scoring — a different unit from the value rows", k:"measured"},
      c.risk_basis === "designation_not_priced" ? {l:"Availability", v:c.injury_status || "no designation", b:"the designation is carried and not charged against his value — this is not “no risk”", k:"not_charged"} : {l:"Availability term", v:f1(c.risk_adj), b:String(c.risk_basis).replace(/_/g, " "), k:"measured"},
      {l:"Drop behind him", v:c.positional_cliff ? `${c.positional_cliff.tier} · ${f1(c.positional_cliff.gap)}` : "—", b:`the engine's tier and the raw gap to the next ${POS[c.position]} in the order it was measured (${M.cliffNext(c) ? short(M.cliffNext(c).name) : "a player not on this board"})`, k:"measured"},
      c.denial_basis === "measured" ? {l:"Kept from a rival", v:f1(c.denial_value) + (c.denial_team ? ` (roster ${c.denial_team})` : ""), b:DENIAL_LABEL.measured + (num(c.denial_value) && Math.abs(c.denial_value) < 0.05 ? " — a zero is a measurement" : ""), k:"measured"} : {l:"Kept from a rival", v:"—", b:DENIAL_LABEL[c.denial_basis] || "not measured", k:"unmeasured"},
      {l:"Picks until your next turn", v:String(S.intervening), b:"a count read off the pick order; shown in place of the survival estimate while that is withheld", k:"count"},
    ];
    (S.withheld || []).forEach(w => rows.push({l:({survival_probability:"Chance he lasts to your next turn", opportunity_cost:"Cost of waiting on him", expected_value_of_waiting:"Expected value if you wait"})[w] || w, v:"withheld", b:"computed, then held back: it failed calibration against real drafts", k:"withheld"}));
    return rows.map(e => `<div class="ev ${e.k}"><span class="el">${e.l}</span><span class="en">${e.v}</span><span class="eb"><i class="ek">${KIND[e.k]}</i> ${e.b}</span></div>`).join("");
  };

  /* ---- atoms ---- */
  M.face = (c, size) => { const init = (c.name || "").split(" ").map(w => w[0]).slice(0, 2).join("");
    const img = location.protocol === "file:" ? "" : `<img alt="" src="https://sleepercdn.com/content/nfl/players/${c.player_id}.jpg" onerror="this.remove()">`;
    return `<span class="face ${size || ""}" data-pos="${c.position}" style="--pc:${pc(c.position)}" title="${esc(c.name)}">${init}${img}</span>`; };
  M.pill = p => `<span class="pill" style="background:${pc(p)}">${p}</span>`;
  M.copyBtn = c => `<button class="copy" data-copy="${esc(c.name)}" title="Copy the name to carry to Sleeper">⧉ copy name</button>`;
  M.whoSub = c => `${M.pill(c.position)}<span>${c.team}</span><span>·</span><span>${Math.round(c.projected_points)} projected pts</span><span>·</span><span>${M.slotPhrase(c)}</span>${c.injury_status ? `<span>·</span>${M.avail(c)}` : ""}`;

  /* ---- rails ---- */
  const box = (p, cls, line2) => `<div class="pk ${cls}" title="${esc(p.no <= S.consumed ? `${p.name} · ${p.pos} · ${p.team}` : `${M.coord(p)} · ${p.mine ? "you" : "Roster " + p.seat}`)}">
      <div class="c"><span>${M.coord(p)}</span>${p.no <= S.consumed ? M.pill(p.pos) : `<span>#${p.no}</span>`}</div>
      <div class="nm">${line2}</div><div class="sd">${p.mine ? "YOU" : "Roster " + p.seat}</div></div>`;
  M.ticks = () => `<div class="ticks">${M.BETWEEN.map(p => `<i title="#${p.no} · Roster ${p.seat}"></i>`).join("")}</div>`;
  /* A: named past boxes (as many whole boxes as fit, newest nearest the clock), YOU ARE UP, one span, YOUR NEXT */
  M.railA = () => {
    const past = M.KNOWN.slice(-14).reverse().map(p => box(p, p.mine ? "mine" : "", short(p.name))).join("");
    return `<div class="past">${past}</div>${box(M.NOW_PICK, "now mine", "YOU ARE UP")}
      <div class="span"><span class="t"><b>${S.intervening} picks</b> before your next turn</span>${M.ticks()}<span class="seats">${M.seatsText()}</span></div>

  M.railB = () => RAIL.map(p => {

    if (p.no < (M.NEXT_NO || Infinity)) return `<div class="pk between" title="#${p.no} · ${M.coord(p)} · Roster ${p.seat}"><div class="sd">R${p.seat}</div></div>`;
    return `<div class="pk future ${p.mine ? "mine" : ""}" title="#${p.no} · ${M.coord(p)}"><div class="sd">${p.mine ? "YOU" : "R" + p.seat}</div></div>`;
  }).join("");

  /* ---- sheets content ---- */
  M.allRosters = focusPos => {
    const seats = [...new Set(RAIL.map(p => p.seat))].sort((a, b) => Number(a) - Number(b));
    return seats.map(seat => { const me = seat === S.seat, picks = me ? S.myPicks : M.KNOWN.filter(p => p.seat === seat);
      const r = slotRoster(picks, S.slots), starters = r.filter(x => x.slot !== "BN"), bench = r.filter(x => x.slot === "BN" && x.p).length;

      const route = focusPos ? (starters.some(x => x.slot === focusPos && !x.p) ? `${focusPos} slot open` : (FLEXIBLE.has(focusPos) && starters.some(x => x.slot === "FLEX" && !x.p)) ? `FLEX only for a ${focusPos}` : `no slot for a ${focusPos}`) : "";
      return `<div class="rcard ${me ? "me" : ""} ${turns.length ? "soon" : ""}"><h4>${me ? "You" : "Roster " + seat}<span class="note">${turns.length ? `picks ${turns.join(", ")} before your next turn` : me ? "on the clock" : "no pick before your next turn"}</span></h4>
        <div class="sg">${starters.map(x => `<span class="sl ${x.p ? "" : "open"} ${!x.p && focusPos && (x.slot === focusPos || (x.slot === "FLEX" && FLEXIBLE.has(focusPos))) ? "fits" : ""}"><i>${x.slot}</i>${x.p ? short(x.p.name) : "open"}</span>`).join("")}</div>
        <div class="ln note">bench ${bench} of ${M.benchTotal}${route ? ` · <b>${route}</b>` : ""}</div></div>`; }).join("");
  };
  M.boardGrid = () => {
    const seats = [...new Set(RAIL.map(p => p.seat))].sort((a, b) => Number(a) - Number(b)), rounds = [...new Set(RAIL.map(p => p.rnd))].sort((a, b) => a - b);
    let html = `<div class="dbgrid" style="grid-template-columns:44px repeat(${seats.length},minmax(58px,1fr))"><div class="dbh"></div>` + seats.map(x => `<div class="dbh">${x === S.seat ? "YOU" : x}</div>`).join("");
    rounds.forEach(r => { html += `<div class="dbh">R${r}</div>`; seats.forEach(x => { const p = RAIL.find(q => q.rnd === r && q.seat === x); if (!p) { html += `<div class="dbc"></div>`; return; }
      const fut = p.no > S.consumed; html += `<div class="dbc ${p.mine ? "mine" : ""} ${fut ? "future" : ""} ${p.no === M.NOW_NO ? "now" : ""}">${fut ? `<span class="q">${M.coord(p)}</span>` : `<span class="p" style="color:${pc(p.pos)}">${p.pos}</span><span class="p">${short(p.name)}</span>`}</div>`; }); });
    return html + "</div>";
  };
  M.squad = subject => `<div class="chair"><div class="who" style="color:var(--gold-b)">What this does</div><p>Three chairs argue <b>${subject}</b>: one for, one against, one to settle it. They read the same facts you see here and may not add a number to them.</p></div>
    <div class="chair"><div class="who" style="color:var(--sky-b)">What it costs</div><p>Three provider calls, then one per follow-up. Nothing is ever called on its own; this room works fully with no provider configured. Callable only while you are on the clock.</p></div>
    <div class="chair"><div class="who" style="color:var(--violet-b)">Where it lands</div><p>On the player you end up taking, readable from the draft board afterwards. No verdict attaches to a player you passed on.</p></div>
    <div class="chair empty"><div class="who">Strategist · Skeptic · Caller</div><p>Not called.</p></div>`;
  return M;
}

/* ============================================================================================
   Chrome shared by every variant: review bar, sheets, copy, and the scroll affordance — every
   list that overflows says so ("↓ N more") so a short list over a dark fold is never mistaken
   for a failed render, and a captioned count never silently differs from what is drawn.
   ============================================================================================ */
function markScrollers(){
  document.querySelectorAll("[data-list]").forEach(el => {
    let more = el.parentElement.querySelector(":scope > .more"); if (!more) { more = document.createElement("div"); more.className = "more"; el.parentElement.appendChild(more); }
    const rows = [...el.querySelectorAll("[data-row]")], edge = el.scrollTop + el.clientHeight;
    const whole = rows.filter(r => r.offsetTop >= edge - 1).length, part = rows.filter(r => r.offsetTop < edge - 1 && r.offsetTop + r.offsetHeight > edge + 1).length;
    if (el.scrollHeight > el.clientHeight + 1 && whole + part > 0) { more.textContent = whole ? `↓ scroll · ${whole} more${part ? " (one cut off)" : ""}` : `↓ scroll · the rest is cut off`; more.hidden = false; el.dataset.more = String(whole + part); }
    else { more.hidden = true; delete el.dataset.more; }
  });
}
function wireChrome(opts){
  const room = document.querySelector(".room");
  let key = (location.hash || "").replace("#", ""); if (!STATE_KEYS.includes(key)) key = "mid";
  const bar = document.getElementById("rev");
  bar.innerHTML = `<span class="tag">${opts.tag}</span><span>${opts.sub}</span><span class="states">${STATE_KEYS.map(k => `<button data-state="${k}" aria-pressed="${k === key}">${k}</button>`).join("")}</span><button class="hyp" id="hypBtn" aria-expanded="false">ⓘ hypothesis</button>`;
  const hyp = document.getElementById("hyp"); hyp.innerHTML = opts.hypothesis; hyp.hidden = true;
  document.getElementById("hypBtn").onclick = e => { hyp.hidden = !hyp.hidden; e.currentTarget.setAttribute("aria-expanded", String(!hyp.hidden)); requestAnimationFrame(markScrollers); };
  const closeAll = () => { room.querySelectorAll(".sheet").forEach(s => { s.dataset.open = "0"; s.setAttribute("aria-hidden", "true"); });
    room.querySelectorAll("[data-sheet]").forEach(b => b.setAttribute("aria-expanded", "false")); const sc = room.querySelector(".scrim"); if (sc) sc.dataset.open = "0"; };
  const open = id => { const s = document.getElementById(id); if (!s) return; const was = s.dataset.open === "1"; closeAll(); if (was) return;
    s.dataset.open = "1"; s.setAttribute("aria-hidden", "false"); room.querySelectorAll(`[data-sheet="${id}"]`).forEach(b => b.setAttribute("aria-expanded", "true")); const sc = room.querySelector(".scrim"); if (sc) sc.dataset.open = "1"; requestAnimationFrame(markScrollers); };
  document.addEventListener("click", e => {
    const st = e.target.closest("[data-state]"); if (st) { key = st.dataset.state; bar.querySelectorAll("[data-state]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.state === key))); closeAll(); history.replaceState(null, "", "#" + key); opts.onState(key); return; }
    const b = e.target.closest("[data-sheet]"); if (b) { open(b.dataset.sheet); return; }
    if (e.target.closest("[data-close]") || e.target.classList.contains("scrim")) { closeAll(); return; }
    const cp = e.target.closest("[data-copy]"); if (cp) { try { navigator.clipboard && navigator.clipboard.writeText(cp.dataset.copy); } catch (_) {} const t = cp.textContent; cp.textContent = "✓ copied"; setTimeout(() => { cp.textContent = t; }, 1200); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll();
    const t = e.target.closest && e.target.closest("[role=button]"); if (t && (e.key === "Enter" || e.key === " ") && !e.target.closest("button")) { e.preventDefault(); t.click(); } });
  document.addEventListener("scroll", e => { if (e.target.dataset && e.target.dataset.list !== undefined) markScrollers(); }, true);
  addEventListener("resize", markScrollers);
  return {open, closeAll, key: () => key};
}
function fillCommon(M){
  const q = id => document.getElementById(id);
  if (q("lg")) q("lg").innerHTML = `<b>12-team PPR Dynasty</b> · round ${M.S.round} of ${M.S.rounds} · you are Roster ${M.S.seat}`;
  if (q("upnow")) q("upnow").textContent = `PICK ${M.S.pick} — YOU ARE UP`;
  if (q("allRosters")) q("allRosters").innerHTML = M.allRosters();
  if (q("dbHost")) q("dbHost").innerHTML = M.boardGrid();
  requestAnimationFrame(markScrollers);
}

let M, focus = null, third = {};
function trioHTML(pos){
  const list = M.atPos(pos); if (!list.length) return "";
  const picked = list.slice(0, 2); const t = M.get(third[pos]); if (t && t.position === pos && !picked.some(x => x.player_id === t.player_id)) picked.push(t); else if (list[2]) picked.push(list[2]);
  const n = picked.length; if (n < 2) return `<div class="trio"><span class="k">Only one ${POS[pos]} on this board<span class="note"> · nothing to set beside him; his own facts are above</span></span></div>`;
  const cols = `grid-template-columns:96px repeat(${n},minmax(0,1fr))`;
  const row = (label, fn) => `<div class="rl">${label}</div>` + picked.map((c, i) => `<div class="cell ${i === 0 ? "lead" : ""}">${fn(c, i)}</div>`).join("");
  const anyH = picked.some(c => f1(c.time_horizon_adj) !== f1(picked[0].time_horizon_adj));
  const anyI = picked.some(c => c.injury_status), anyD = picked.some(c => M.depth(c).n);
  return `<div class="trio"><span class="k">The ${n === 2 ? "two" : "three"} at ${pos}, side by side<span class="note"> · the next-turn value is identical within a position, so this is value, the measured drop and what else differs; identical rows are not shown</span></span>
    <div class="tg" style="${cols}"><div></div>${picked.map((c, i) => `<div class="hd">${M.face(c, "sm")}<span class="nm">${M.short(c.name)}<small>${c.team} · #${c.rank}${i === 2 && list.length > 3 ? ` <button class="swap" data-swapinfo="1" title="Click any name lower in the lane to put him here">swap ↓</button>` : ""}</small></span></div>`).join("")}
      ${row("value now", (c, i) => `<span class="mono">${f1(c.team_acquisition_value)}</span>${i ? ` <span class="note">${sgn(c.team_acquisition_value - picked[0].team_acquisition_value)}</span>` : ""}${M.displaced(c) ? `<div class="note">${f1(c.displacement_adj)} displacement · himself ${f1(c.team_acquisition_value - c.displacement_adj)}</div>` : ""}`)}
      ${row("proj. pts", c => `<span class="mono">${Math.round(c.projected_points)}</span>`)}
      ${row("drop behind", c => `${M.tierWord(c)} <span class="mono">${f1(c.positional_cliff.gap)}</span> ${M.cliffTo(c)}`)}
      ${anyH ? row("horizon", c => `<span class="mono">${sgn(c.time_horizon_adj)}</span>`) : ""}
      ${anyI ? row("designation", c => c.injury_status ? M.avail(c) : "none") : ""}
      ${anyD ? row("depth insurance", c => M.depth(c).n ? `<span class="mono">${M.depth(c).n}</span> <span class="note">measured</span>` : `<span class="note">${M.depth(c).why}</span>`) : ""}
    </div></div>`;
}
function laneHTML(pos){

  const open = M.openAt(pos), want = M.STARTERS.filter(r => r.slot === pos).length;
  const st = held.length === 0 ? `none held — slot open` : open ? `${held.map(p => M.short(p.name)).join(", ")} · ${open} slot open` : `${held.map(p => M.short(p.name)).join(", ")}${M.openFlex && FLEXIBLE.has(pos) ? " · next → FLEX" : " · next → bench"}`;
  const f = M.FORFEIT[pos];
  const cost = num(f) ? `best left at #${M.NEXT_NO} if you wait: <b>${f1(M.NEXTV[pos])}</b> · waiting costs <b>${f1(f)}</b>${M.costWord(pos) ? ` <span class="w">· ${M.costWord(pos)}</span>` : ""}` : `<span class="w">no next-turn value measured — no ${POS[pos]} in the board's top ${M.C.length}</span>`;

    const L = M.LEADER, isFirst = lead.player_id === L.player_id;
    const vs = isFirst ? (M.C[1] ? `<b>First on the board</b>, ${f1(L.team_acquisition_value - M.C[1].team_acquisition_value)} ahead of #${M.C[1].rank} ${M.short(M.C[1].name)} (${M.C[1].position}).` : "<b>First on the board.</b>")
      : `<b>#${lead.rank} on the board</b> — instead of #1 ${M.short(L.name)}:`;
    const rest = list.slice(isFocus ? Math.min(3, list.length) : 1);
    body = `<div class="lead1"><div class="who"><span class="rank ${isFirst ? "" : "dim"}" title="rank ${lead.rank} on the board">#${lead.rank}</span>${M.face(lead)}<span style="min-width:0"><div class="nm">${lead.name}</div><div class="sub">${lead.team} · ${Math.round(lead.projected_points)} pts · ${M.slotShort(lead)}${lead.injury_status ? ` · <i class="inj">${lead.injury_status}</i>` : ""}</div></span></div><div class="valrow"><span class="big">${f1(lead.team_acquisition_value)}</span><span class="u">to your roster</span></div>
        ${M.displaced(lead) ? M.dispShort(lead) : ""}

      ${isFocus ? trioHTML(pos) : ""}
      <div class="rest fade" data-list="${pos}">${rest.map(c => `<div class="rr" data-row data-id="${c.player_id}" role="button" tabindex="0"><span class="nm"><span class="rank dim">#${c.rank}</span>${c.name}<small>${c.team} · ${Math.round(c.projected_points)} pts</small></span><span class="v">${f1(c.team_acquisition_value)}</span><span class="cue">${sgn(c.team_acquisition_value - lead.team_acquisition_value)} vs ${M.short(lead.name)} · ${M.tierWord(c)} behind (${f1(c.positional_cliff.gap)})${c.injury_status ? ` · ${M.avail(c)}` : ""}</span></div>`).join("")}</div>

function draw(){

  const el = document.getElementById("lanes");
  el.style.gridTemplateColumns = M.LINEUP_ORDER.map(p => p === focus ? "1.9fr" : M.best(p) ? "1fr" : ".55fr").join(" ");
  el.innerHTML = M.LINEUP_ORDER.map(laneHTML).join("");
  const fb = M.best(focus) || M.LEADER;
  document.getElementById("slots").innerHTML = M.rosterStrip(fb, false);
  document.getElementById("firstNote").innerHTML = `lit: the slot ${M.short(fb.name)} would fill · <b>the board: ${M.C.length} names</b>`;
  requestAnimationFrame(markScrollers);
  document.getElementById("debate").innerHTML = M.squad(`the ${focus} lane against the board's first name`);
}
function load(key){
  M = buildModel(key); third = {}; focus = M.LEADER.position;
  fillCommon(M);
  document.getElementById("wait").innerHTML = `${M.clockText()}<br>${M.waitText()}`;

}
const ui = wireChrome({tag:"v2 · LANES", sub:"position layer persistent, fixed order · lanes are the pool · within-position always on in the focused lane · NO RAIL", hypothesis:`<b>Hypothesis.</b> The owner found Lanes clean and asked whether the room needs a rail at all, so this is lanes with no rail: the clock line names who is on the clock, who is next and what was last taken, and says when you pick again; the draft board is a tab. The four lanes sit in the lineup's own order — QB · RB · WR · TE — and <b>never reorder</b>; what each position leaves at your next turn changes inside its header instead, so the ordering's instability across the draft becomes changing contents in stable columns. The focused lane widens into the genuinely new thing: the two or three names at that position side by side on the facts that differ within a position. Every other lane's lead carries its cost against the board's first name as now · next turn · plan, so the alternatives are costed, not ranked as errors. This is an explicit §1 change request; the rationale names the cost.`, onState:load});
document.addEventListener("click", e => {
  const w = e.target.closest("[data-work]"); if (w) { const c = M.get(w.dataset.work); document.getElementById("workT").textContent = `The numbers · ${c.name}`; document.getElementById("work").innerHTML = M.working(c); ui.open("shWork"); return; }
