<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doors Draft Room</title>
<meta name="description" content="Build target — every position the league can start has a door; four or five surface in the board's order and the window slides; each offensive door carries its pool tank; the drawer is the override surface with the position's context above the filtered list.">
<style>
/*__CSS__*/
/* v4 — DOORS, multi-format. All position doors exist (derived from the league's own slots and the
   engine's flex map); 4–5 surface in the board's value order; the window slides; a count line says
   so; the drawer carries the position's context when filtered; demand carries its basis verbatim. */
/* The strip is one line, and it must stay one line: when it wraps it takes ~30px straight out
   of the open door's card region below, which in the 13-starter formats collapses that region
   to zero cards with its scroll affordance off the bottom of the viewport. HEAVY_IDP late was
   measured 25px over at gap 5 / padding .16-.4; these metrics clear it with room. */
.lineup .slots{flex:0 1 auto;gap:4px}
.lineup .slotc{padding:.12rem .34rem}
.clk .who{margin-left:auto;white-space:nowrap;font-size:.86rem;color:var(--muted)} .clk .who b{color:var(--ink)}
.clk .spanline{white-space:nowrap}
.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:8px 16px 8px;gap:8px}
/* the count line: a window that says it is a window */
.count{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);flex:0 0 auto}
.count b{color:var(--ink)}
.count .chips{display:inline-flex;gap:5px;flex-wrap:wrap}
.count .chip{font-family:var(--f-m);font-size:.75rem;font-weight:700;padding:.06rem .4rem;border:1px solid var(--line-2);border-radius:2px;color:var(--muted);cursor:pointer;background:var(--surface)}
.count .chip:hover{color:var(--ink);border-color:var(--dim)}
.count .chip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.count .cnt{margin-left:auto}
/* Door geometry must not depend on how much text a door happens to carry. A door with a
   filled-slot displacement line, or the one carrying "the dearest position to wait on", ran
   18-116px taller than its neighbours (measured across all 18 format/state pairs) and the row
   came out ragged along the bottom. The grid row is ALREADY as tall as its tallest door, so
   that height is reserved either way -- the short doors simply declined to occupy it. They
   occupy it now, at no cost in vertical space, and the slack collects in one designated place:
   above the footer, which pins to the bottom edge, so every "click to open" sits on one
   baseline however much stands above it. */
.doors{display:grid;gap:9px;flex:0 0 auto;align-items:stretch}
.door .dact{margin-top:auto}
.doors.all{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;grid-template-columns:repeat(auto-fill,minmax(262px,1fr))!important}
.door{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);display:grid;grid-template-columns:18px minmax(0,1fr);min-width:0;cursor:pointer;will-change:transform;position:relative}
.door.open{border-color:var(--gold-b);box-shadow:0 0 0 1px rgba(247,207,74,.25),0 0 18px rgba(212,160,23,.12);cursor:default}
.door.none{opacity:.75;background:var(--surface-2)}
/* position identity: the left stripe is the position's colour whether or not a tank is drawn */
.door .edge{grid-row:1/-1;border-right:1px solid var(--line-2);background:var(--surface-2);position:relative;overflow:hidden;align-self:stretch}
.door .edge::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.door .edge .tank{position:absolute;left:4px;right:0;top:0;bottom:0;width:auto;border:none;border-radius:0}
.door .edge.notank{background:repeating-linear-gradient(135deg,var(--surface-2) 0 4px,var(--surface) 4px 8px)}
.tank .zone{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(135deg,rgba(247,207,74,.18) 0 3px,transparent 3px 6px)}
.tank .mark{height:3px;background:var(--gold-b)}
.tank .fill{background:var(--tie)} .tank .fill.st{background:var(--emerald)}
.door .body{min-width:0;display:flex;flex-direction:column}
.dh{padding:8px 12px 7px;border-bottom:1px solid var(--line)}
.dh .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dh .pos{font-family:var(--f-d);font-size:1.04rem;font-weight:700;display:flex;align-items:baseline;gap:7px;white-space:nowrap;flex:0 0 auto}
.dh .n{margin-left:auto;font-family:var(--f-m);font-size:.75rem;color:var(--gold-b);white-space:nowrap;font-weight:700}
.dh .n.dim{color:var(--dim);font-weight:400}
.dh .st{font-size:.8rem;color:var(--muted);margin-top:2px} .dh .st.need{color:var(--amber-b)}
.dh .dem{font-size:.78rem;color:var(--dim);margin-top:2px} .dh .dem b{color:var(--muted);font-family:var(--f-m);font-weight:600}
.dh .wait{font-size:.82rem;color:var(--muted);margin-top:4px;line-height:1.4} .dh .wait b{font-family:var(--f-m);color:var(--ink);font-weight:600}
.dh .wait .dear{display:block;color:var(--amber-b)}
.dh .tankcap{margin-top:3px}
.db{padding:7px 12px 6px;display:flex;flex-direction:column;gap:4px}
.who{display:flex;align-items:center;gap:10px}
.who .nm{font-weight:700;font-size:1.02rem;line-height:1.15}
.who .sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.valrow{display:flex;align-items:baseline;gap:8px} .valrow .big{font-size:1.2rem} .valrow .u{margin:0}
.vs{font-size:.84rem;color:var(--muted);line-height:1.45;margin:0} .vs b{color:var(--ink)}
.door .cost2{display:flex;gap:12px;flex-wrap:wrap} .door .cost2 .cc{gap:4px} .door .cost2 .cc .cv{font-size:.9rem}
.then{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.then .k{display:block;margin-bottom:2px;white-space:normal}
.then .tr{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:.84rem;padding:2px 0}
.then .tr .rk{font-family:var(--f-m);font-size:.75rem;color:var(--dim)}
.then .tr .nm{min-width:0}
.then .tr .g{font-family:var(--f-m);color:var(--muted);white-space:nowrap}
.dact{display:flex;gap:6px;padding:4px 12px;border-top:1px solid var(--line);align-items:center}
.door .empty{padding:10px 12px;color:var(--dim);font-size:.84rem;line-height:1.5}
/* the open door's names, side by side */
.call{flex:0 1 auto;min-height:0;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:6px 14px 6px;display:flex;flex-direction:column}
.call .cards{overflow-y:auto;min-height:0;flex:1 1 auto;scrollbar-width:thin;padding-bottom:2px}
.call .ch{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.call .ch .t{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-b);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--surface-2);min-width:0}
.card .who .nm{font-size:.95rem}
.card ul{margin:4px 0 0;padding:0;list-style:none;font-size:.86rem;color:var(--muted);line-height:1.45}
.card li b{color:var(--ink)} .card li .mono{color:var(--ink)}
.card.one{grid-column:1/-1;display:flex;align-items:center;gap:14px;color:var(--dim);font-size:.86rem}
/* the drawer: filter + per-position context above the list */
.drawer .filt{display:flex;gap:4px;flex-wrap:wrap;padding:8px 10px 6px}
.ctx{margin:0 10px 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2);padding:8px 10px;display:grid;grid-template-columns:18px minmax(0,1fr);gap:0 10px}
.ctx .edge{border-radius:2px;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line-2)}
.ctx .edge::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.ctx .edge .tank{position:absolute;left:4px;right:0;top:0;bottom:0;width:auto;border:none;border-radius:0}
.ctx .t{font-family:var(--f-d);font-weight:700;font-size:1rem;display:flex;gap:8px;align-items:baseline}
.ctx .t .n{margin-left:auto;font-family:var(--f-s);font-weight:400;font-size:.78rem;color:var(--dim)}
.ctx p{margin:3px 0 0;font-size:.84rem;color:var(--muted);line-height:1.45} .ctx p b{color:var(--ink);font-family:var(--f-m);font-weight:600}
.ctx p .dear{color:var(--amber-b)}
.srow{display:grid;grid-template-columns:24px 34px minmax(0,1fr) auto;gap:4px 9px;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.95rem}
.srow:hover{background:var(--surface-2)}
.srow .rk{font-family:var(--f-m);font-size:.8rem;color:var(--dim)}
.srow .pill{display:flex;align-items:center;justify-content:center;padding:.48rem 0 .36rem;font-size:.8rem;line-height:1}
.srow .nm{font-weight:600;min-width:0;font-size:1.02rem} .srow .nm small{color:var(--dim);font-weight:400;font-size:.82rem;margin-left:6px}
.srow .v{font-family:var(--f-m);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap} .srow .v small{font-weight:400;color:var(--dim);font-size:.8rem;margin-left:5px;font-family:var(--f-s)}
.srow .meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 10px;min-width:0}
.srow .tk{font-size:.86rem;color:var(--muted);line-height:1.4}
</style></head><body>
<div class="room">
  <div class="rev" id="rev"></div><div class="hypbox" id="hyp" hidden></div>
  <header class="hdr"><span class="wm">Gold Wyrm</span><span class="lg" id="lg"></span>
    <span class="r"><button class="btn" data-sheet="shAll" aria-expanded="false">≣ Every name</button><button class="btn" data-sheet="shRosters" aria-expanded="false">▤ Rosters</button>
      <button class="btn" data-sheet="shBoard" aria-expanded="false">▦ Draft board</button>
      <button class="btn paid" data-sheet="shDebate" aria-expanded="false" data-tip="Billed, and only while you are on the clock.">⚑ Debate</button>
      <button class="btn" data-tip="Not wired up
A placeholder, so the layout is complete. This prototype reads one fixed capture, so there is nothing here to re-read; in the live room this re-pulls the draft state and moves the &quot;as of pick&quot; mark in the league line.">⟳ Resync</button><button class="btn" data-tip="Settings">⚙</button></span></header>
  <div class="clk"><span class="timer"><small>clock</small>1:27</span><span class="upnow" id="upnow"></span><span class="spanline" id="spanline"></span><span class="who" id="boardn"></span></div>
  <div class="lineup"><span class="k">Your lineup</span><div class="slots" id="slots"></div></div>
  <div class="main">
    <div class="count" id="count"></div>
    <div class="doors" id="doors"></div>
    <div class="call" id="call"></div>
  </div>
  <div class="scrim"></div>
  <section class="sheet right drawer" id="shAll" aria-hidden="true"><div class="sh"><span class="t">Every name on the board</span><span class="note" id="allNote"></span><button class="x" data-close="1">close ✕</button></div><div class="filt" id="allFilt"></div><div id="allCtx"></div><div class="sc" id="allList" style="padding:0 10px 6px"></div></section>
  <section class="sheet right" id="shWork" aria-hidden="true"><div class="sh"><span class="t" id="workT">The numbers</span><button class="x" data-close="1">close ✕</button></div><div class="sc" id="work"></div></section>
  <section class="sheet top" id="shRosters" aria-hidden="true"><div class="sh"><span class="t">Rosters</span><span class="note" id="rosterNote"></span><button class="x" data-close="1">close ✕</button></div><div class="sc"><div class="rosterGrid" id="allRosters"></div></div></section>
  <section class="sheet top" id="shBoard" aria-hidden="true"><div class="sh"><span class="t">Draft board</span><span class="note">every pick made so far; the rest are coordinates</span><button class="x" data-close="1">close ✕</button></div><div class="sc" id="dbHost"></div></section>
  <section class="sheet right" id="shDebate" aria-hidden="true"><div class="sh"><span class="t">Debate</span><button class="x" data-close="1">close ✕</button></div><div class="sc" id="debate"></div></section>
</div>
<script>
/*__DATA__*/
/*__SHARED__*/
let M, openKey = null, filt = "ALL";
const Q = new URLSearchParams(location.search);
const SHOW_TANK = !Q.has("notank");         // ?notank: the screen without the tank, for comparison
const ALL_DOORS = Q.has("alldoors");
let STREAM_HIDE = !Q.has("streamers");   // #30: streamed positions held back; ?streamers starts them shown        // ?alldoors: every door forced visible, so the window rule can be judged
const WINDOW = 5;
const DOOR_LABEL = {QB:"Quarterback", RB:"Running back", WR:"Receiver", TE:"Tight end", K:"Kicker", DEF:"Defense", DL:"D-line", LB:"Linebacker", DB:"D-back", IDP:"Defenders"};
const doorLabel = d => DOOR_LABEL[d.key] || d.label;                           // 4–5 surface (DESIGN_RECORD §6); fewer when the league has fewer doors
const doorBest = d => M.doorBest(d);
const posOf = d => { const b = doorBest(d); return b ? b.position : d.positions[0]; };   // the position the door's numbers come from
/* the window: the first WINDOW doors in the board's order; the open door is always in it */
function windowDoors(){
  const order = (STREAM_HIDE && !ALL_DOORS)
    ? M.DOOR_ORDER.filter(d => !M.isStreamDoor(d) || d.key === openKey)
    : M.DOOR_ORDER;
  if (ALL_DOORS || order.length <= WINDOW) return order;
  const w = order.slice(0, WINDOW); const open = order.find(d => d.key === openKey);
  if (open && !w.includes(open)) w[WINDOW - 1] = open;
  return w;
}
function tankHTML(pos, cls){
  if (!SHOW_TANK || !M.tankable(pos)) return `<span class="edge notank ${cls || ""}" style="--pc:${pc(pos)}" data-tip="${M.tankable(pos) ? "No pool sample from the engine for this format." : "No tank: §14 draws the pool gauge for offensive positions only."}"></span>`;
  const t = M.tank(pos); if (!t) return `<span class="edge notank ${cls || ""}" style="--pc:${pc(pos)}" data-tip="No pool sample from the engine for this format."></span>`;
  const fillPct = 100 * t.left / t.N, markPct = 100 * (t.N - t.starters) / t.N;
  return `<span class="edge ${cls || ""}" style="--pc:${pc(pos)}"><span class="tank" data-tip="${POS[pos]} pool
${t.pctLeft}% of the engine's priced ${PLUR[pos]} are still on the board — its sample as of #${t.sampleAt}.
The gold line is where the position stops producing starters in the replacement sense. It is a marker rather than an edge: below it players are still startable, and what runs out at the line is surplus over replacement, not production.
The engine prices ${Math.round(100 * t.coverage)}% of the ${PLUR[pos]} listed, so an empty tank means it ran out of rated players, not that the position is gone."><span class="fill ${t.startersLeft ? "st" : ""}" style="height:${fillPct}%"></span><span class="zone" style="height:${100 - markPct}%"></span><span class="mark" style="bottom:${markPct}%"></span></span></span>`;
}
function tankCap(pos){
  const t = SHOW_TANK ? M.tank(pos) : null;
  if (!t) return M.tankable(pos) && SHOW_TANK ? `<div class="tankcap">pool: no engine sample for this format</div>` : "";
  return `<div class="tankcap">pool <b>${t.pctLeft}% left</b> as of #${t.sampleAt} · ${t.startersLeft ? `<b>starters left</b>` : `<span class="gone">past the starter line · startable, not an upgrade</span>`}</div>`;
}
function holdText(d){
  const held = M.S.myPicks.filter(p => d.positions.includes(p.pos)), open = d.positions.reduce((n, p) => n + M.openAt(p), 0);
  const names = held.length > 2 ? `${held.length} held` : held.map(p => M.short(p.name)).join(", ");
  const fx = M.openFlexFor(d.positions[0]);
  return {need: held.length === 0, text: held.length === 0 ? (open ? `you hold none — slot open` : fx ? `you hold none — ${fx.slot} open` : `you hold none`) : open ? `${names} · ${open} slot open` : `${names}${fx ? " · next → " + fx.slot : " · next → bench"}`};
}
function doorHTML(d, idx){
  const best = doorBest(d), pos = posOf(d), list = best ? M.C.filter(c => d.positions.includes(c.position)) : [], h = holdText(d);
  const wait = best ? `${M.waitLine(pos, true)}${pos === M.DEAREST && M.POS_BY_COST.length > 1 ? `<span class="dear">The dearest position to wait on right now.</span>` : ""}` : `No ${d.compound ? "defender" : POS[d.key]} in the board's top ${M.C.length}.`;
  const demPs = d.positions.filter(p => num(M.DEMAND[p]));
  const demSame = demPs.length > 1 && demPs.every(p => M.demandText(p) === M.demandText(demPs[0]));
  const dem = demSame ? `${demPs.join(" · ")} each — ${M.demandText(demPs[0])}`
    : demPs.map(p => `${d.compound ? p + " " : ""}${M.demandText(p)}`).join(" · ");
  let body;
  if (!best) body = `<div class="empty">${h.need ? "You hold none." : `You hold ${M.S.myPicks.filter(p => d.positions.includes(p.pos)).map(p => M.short(p.name)).join(", ")}.`}</div>`;
  else {
    const L = M.LEADER, first = best.player_id === L.player_id;
    const vs = first ? (M.C[1] ? `<b>First on the board</b>: ${f1(L.team_acquisition_value - M.C[1].team_acquisition_value)} ahead of ${M.short(M.C[1].name)} (${M.C[1].position}).` : "<b>First on the board.</b>") : `Instead of ${M.short(L.name)}:`;
    body = `<div class="db"><div class="who">${M.face(best)}<span style="min-width:0"><div class="nm">${best.name}</div><div class="sub">${d.compound ? best.position + " · " : ""}${best.team} · ${M.pts(best)} · ${M.slotShort(best)}${best.injury_status ? ` · ${M.avail(best)}` : ""}</div></span></div>
      <div class="valrow"><span class="big">${f1(best.team_acquisition_value)}</span><span class="u">to your roster now</span></div>${M.displaced(best) ? M.dispShort(best) : ""}
      <p class="vs">${vs}${first ? "" : ` <span class="cost2" style="display:inline-flex">${M.costHTML(best, L)}</span>`}</p>
      ${list.length > 1 ? (() => { const dep = M.doorDepth(d, best, list), rest = list.length - 1 - dep.length;
        return `<div class="then"><span class="k">then at ${d.key}${d.compound ? " · best of each" : ""}</span>${dep.map((c, i) => `<div class="tr"><span class="rk">${d.compound ? c.position : i + 2}</span><span class="nm">${c.name}${M.armMark(c)}</span><span class="g">${sgn(c.team_acquisition_value - best.team_acquisition_value)}</span></div>`).join("")}${rest > 0 ? `<div class="tr"><span></span><span class="note">+ ${rest} more in the drawer</span></div>` : ""}</div>`; })() : `<div class="then"><span class="k">the only ${d.compound ? "defender" : POS[d.key]} on the board</span></div>`}</div>
      <div class="dact"><span class="note" style="margin-left:0">${d.key === openKey ? "open below — copy and numbers are on the cards" : `click to open ${d.key}`}</span></div>`;
  }
  return `<section class="door ${d.key === openKey ? "open" : ""} ${best ? "" : "none"}" data-door="${d.key}">${tankHTML(pos)}<div class="body"><div class="dh"><div class="top"><span class="pos" style="color:${pc(d.key)}" data-tip="${d.label}">${M.pill(d.key)}${doorLabel(d)}</span><span class="n ${best ? "" : "dim"}" data-tip="${best ? ordinal(idx + 1) + " of " + M.DOOR_ORDER.length + " doors, in the board's order" : "no name on the board"}">${best ? `${ordinal(idx + 1)} of ${M.DOOR_ORDER.length}` : "no name"}</span></div><div class="st ${h.need ? "need" : ""}">${h.text}</div>${dem ? `<div class="dem">${dem}</div>` : ""}<div class="wait">${wait}</div>${best ? tankCap(pos) : ""}</div>${body}</div></section>`;
}
/* the default open door, which must never be one STREAM_HIDE is holding back */
function defaultOpen(){
  const lead = M.doorOf(M.LEADER.position);
  if (!(STREAM_HIDE && !ALL_DOORS && M.isStreamDoor(lead))) return lead.key;
  const first = M.DOOR_ORDER.find(d => !M.isStreamDoor(d));
  return (first || lead).key;
}
function countHTML(w){
  const all = M.DOOR_ORDER;
  const held = (STREAM_HIDE && !ALL_DOORS) ? all.filter(d => M.isStreamDoor(d) && !w.includes(d)) : [];
  const hidden = all.filter(d => !w.includes(d) && !held.includes(d));
  return `<span><b>${all.length} positions</b> this league can start · <b>showing ${w.length}</b>, in the board's order${all.length > w.length ? " — the window slides as the board changes" : ""}</span>
    ${hidden.length ? `<span class="chips">not shown: ${hidden.map(d => `<span class="chip" data-open="${d.key}" data-tip="Open the ${d.label} door"><i style="background:${pc(d.key)}"></i>${d.key}${doorBest(d) ? ` ${ordinal(M.DOOR_ORDER.indexOf(d) + 1)} door` : " —"}</span>`).join("")}</span>` : ""}
    ${held.length ? `<span class="chips held">Streamable positions: ${held.map(d => `<span class="chip" data-open="${d.key}" data-tip="Open the ${d.label} door"><i style="background:${pc(d.key)}"></i>${d.key}</span>`).join("")} <a href="#" data-streamtoggle>show them</a></span>` : (STREAM_HIDE ? "" : `<span class="chips held"><a href="#" data-streamtoggle>set streamable aside</a></span>`)}
    <span class="cnt note"><b>the board: ${M.C.length} names</b> · lit slot: where the open door's best would start · every name, any position: the drawer ≣${ALL_DOORS ? " · all doors forced visible (?alldoors)" : ""}</span>`;
}
function callHTML(){
  const d = M.DOORS.find(x => x.key === openKey), list = M.C.filter(c => d.positions.includes(c.position)).slice(0, 3);
  if (!list.length) return `<div class="ch"><span class="t">${d.key} door</span><span class="note">nothing to lay side by side — no ${d.compound ? "defender" : POS[d.key]} in the board's top ${M.C.length}</span></div>`;
  const b = list[0], same = k => list.every(c => k(c) === k(list[0]));
  const slotSame = same(c => M.slotShort(c)), horSame = same(c => f1(c.time_horizon_adj)), depthSame = same(c => M.depth(c).n || "");
  const card = (c, i) => { const dp = M.depth(c); return `<div class="card" data-row>
    <div class="who">${M.face(c, "sm")}<span style="min-width:0"><div class="nm">${i + 1} · ${c.name}</div><div class="sub">${d.compound ? c.position + " · " : ""}${c.team} · #${c.rank} on the board · ${M.pts(c)}</div></span><span style="margin-left:auto;display:flex;gap:6px;flex:0 0 auto">${M.copyBtn(c)}<button class="btn sm" data-work="${c.player_id}">numbers</button></span></div>
    <div class="valrow"><span class="big" style="font-size:1.05rem">${f1(c.team_acquisition_value)}</span><span class="note">${i ? `${sgn(c.team_acquisition_value - b.team_acquisition_value)} vs ${M.short(b.name)}` : "the door's best"}</span></div>
    <ul>${slotSame ? "" : `<li>${M.slotPhrase(c)}</li>`}<li><b>${M.tierWord(c)}</b> behind him <span class="mono">${f1(c.positional_cliff.gap)}</span> ${M.cliffTo(c)}</li>${horSame ? "" : `<li>dynasty horizon <span class="mono">${sgn(c.time_horizon_adj)}</span></li>`}${c.injury_status ? `<li>${M.avail(c)}</li>` : ""}${depthSame ? "" : `<li>depth insurance ${dp.n ? `<span class="mono">${dp.n}</span> <span class="note">measured</span>` : `<span class="note">${dp.why}</span>`}</li>`}</ul></div>`; };
  const shared = [slotSame ? `${M.slotShort(b)}` : null, M.displaced(b) && same(c => f1(c.displacement_adj)) ? `<span style="color:var(--amber-b)">${f1(b.displacement_adj)} filled-slot displacement (measured)</span>` : null, list.length > 1 && horSame ? `horizon ${sgn(b.time_horizon_adj)}` : null, list.length > 1 && depthSame && M.depth(b).n ? `depth insurance ${M.depth(b).n}` : null].filter(Boolean);
  return `<div class="ch"><span class="t">${d.key} door open</span><span class="note">only what differs is shown${shared.length ? ` · same for all: ${shared.join(" · ")}` : ""} · lasts to #${M.NEXT_NO}? <span class="wh">withheld</span></span></div>
    <div class="cards" data-list="cards">${list.map(card).join("")}${list.length === 1 ? `<div class="card one">Only one ${d.compound ? "defender" : POS[d.key]} is rated on this board; nothing to set beside him.</div>` : ""}</div>`;
}
/* the drawer: a filter per door; when filtered, the position's context sits above the list */
function drawerHTML(){
  const keys = ["ALL"].concat(M.DOORS.map(d => d.key));
  document.getElementById("allFilt").innerHTML = keys.map(k => `<button data-f="${k}" aria-pressed="${k === filt}" style="${k !== "ALL" ? `border-color:${pc(k)}` : ""}">${k}</button>`).join("");
  const d = M.DOORS.find(x => x.key === filt), list = d ? M.C.filter(c => d.positions.includes(c.position)) : M.C;
  let ctx = "";
  if (d) { const pos = posOf(d), h = holdText(d), inWin = windowDoors().includes(d), idx = M.DOOR_ORDER.indexOf(d);
    ctx = `<div class="ctx">${tankHTML(pos)}<div><div class="t"><span style="color:${pc(d.key)}">${doorLabel(d)}</span><span class="n">${doorBest(d) ? `${ordinal(idx + 1)} of ${M.DOOR_ORDER.length} in the board's order · ${inWin ? "on the main surface" : "not on the main surface — the window is showing higher doors"}` : "no name on the board"}</span></div>
      <p>${h.text}${d.positions.filter(p => num(M.DEMAND[p])).map(p => ` · ${d.compound ? p + " " : ""}${M.demandText(p)}`).join("")}</p>
      <p>${doorBest(d) ? M.waitLine(pos) : `No ${d.compound ? "defender" : POS[d.key]} in the board's top ${M.C.length}, so nothing to wait on is measured.`}${pos === M.DEAREST && doorBest(d) && M.POS_BY_COST.length > 1 ? ` <span class="dear">The dearest position to wait on right now.</span>` : ""}</p>
      ${doorBest(d) ? tankCap(pos).replace("tankcap", "note") : ""}</div></div>`; }
  document.getElementById("allCtx").innerHTML = ctx;
  document.getElementById("allList").innerHTML = list.map(x => `<div class="srow" data-open="${M.doorOf(x.position).key}" role="button" tabindex="0"><span class="rk">${x.rank}</span>${M.pill(x.position)}<span class="meta"><span class="nm">${x.name}${M.armMark(x)}<small>${x.team} · ${M.pts(x)}</small></span><span class="v">${f1(x.team_acquisition_value)}<small>${x.player_id === M.LEADER.player_id ? "first" : sgn(x.team_acquisition_value - M.LEADER.team_acquisition_value)}</small></span><span class="tk">${M.slotShort(x)} · ${M.tierWord(x)} behind (${f1(x.positional_cliff.gap)}, ${M.cliffTo(x)})${x.injury_status ? ` · ${M.avail(x)}` : ""}</span></span></div>`).join("") || `<p class="note" style="padding:10px">No ${d ? (d.compound ? "defender" : POS[d.key]) : "name"} in the board's top ${M.C.length}.</p>`;
  document.getElementById("allNote").innerHTML = `${list.length} of ${M.C.length} names · click one to open his door`;
}
function flipDraw(){
  const host = document.getElementById("doors"), before = {}, w = windowDoors();
  host.querySelectorAll(".door").forEach(d => { before[d.dataset.door] = d.getBoundingClientRect().left; });
  host.style.gridTemplateColumns = `repeat(${Math.max(1, w.length)},minmax(0,1fr))`;
  host.classList.toggle("all", ALL_DOORS); if (ALL_DOORS) host.dataset.list = "doors";
  host.innerHTML = w.map(d => doorHTML(d, M.DOOR_ORDER.indexOf(d)).replace('<section class="door', '<section data-row class="door')).join("");
  host.querySelectorAll(".door").forEach(d => { const b = before[d.dataset.door]; if (b === undefined) return; const dx = b - d.getBoundingClientRect().left; if (!dx) return;
    d.style.transition = "none"; d.style.transform = `translateX(${dx}px)`; requestAnimationFrame(() => { d.style.transition = "transform .45s ease"; d.style.transform = ""; }); });
  document.getElementById("count").innerHTML = countHTML(w);
}
function draw(){
  flipDraw();
  document.getElementById("call").innerHTML = ALL_DOORS ? `<div class="ch"><span class="t">all ${M.DOOR_ORDER.length} doors forced visible</span><span class="note">?alldoors — for judging the window rule; the open door's cards are not drawn in this mode</span></div>` : callHTML();
  if (!M.DOORS.some(x => x.key === openKey)) openKey = defaultOpen();
  const d = M.DOORS.find(x => x.key === openKey), b = doorBest(d) || M.LEADER;
  document.getElementById("slots").innerHTML = M.rosterStrip(b, false);
  document.getElementById("debate").innerHTML = M.squad(`the ${openKey} door against the board's first name`);
  document.getElementById("allRosters").innerHTML = M.allRosters();
  document.getElementById("rosterNote").innerHTML = `every roster as a lineup · the rosters picking before #${M.NEXT_NO} are lit`;
  drawerHTML();
  requestAnimationFrame(markScrollers);
}
function load(key, fmt){
  M = buildModel(key, fmt); openKey = defaultOpen(); filt = "ALL";
  fillCommon(M);
  document.getElementById("spanline").innerHTML = `<span style="white-space:nowrap">${M.waitShort()}</span><span data-tip="${M.seatsText()}">${M.ticks()}</span>`;
  document.getElementById("boardn").innerHTML = M.clockShort();
  draw();
}
const ui = wireChrome({formats:true, tag:"v4 · DOORS", sub:"build target · 4–5 doors surface in the board's order · the drawer is the override", hypothesis:`<b>What this is.</b> Every position the league's own slots can start has a door — named slots first, then each flex slot's eligible positions from the engine's map (TE always its own; flex-only defenders compound into one). Doors sit in the board's value order and <b>${WINDOW} surface</b>; the window slides as the board changes, the count line says how many are hidden and names them, and the open door is always in view. The drawer (≣) is the override: filter to any position and its context — what you hold, its demand with the basis the engine reports, what waiting leaves, its tank — sits above the filtered names. Demand is rendered as the engine produced it and labelled with its basis; nothing is corrected. Tanks are offense-only and appear only where the engine sampled this format's pool. <code>?alldoors</code> forces every door visible; <code>?notank</code> hides the tank.`, onState:load});
document.addEventListener("click", e => {
  const w = e.target.closest("[data-work]"); if (w) { const c = M.get(w.dataset.work); document.getElementById("workT").textContent = `The numbers · ${c.name}`; document.getElementById("work").innerHTML = M.working(c); ui.open("shWork"); return; }
  const bn = e.target.closest("[data-bench]");
  if (bn) { const seat = bn.dataset.bench;
    M.benchToggled.has(seat) ? M.benchToggled.delete(seat) : M.benchToggled.add(seat);
    document.getElementById("allRosters").innerHTML = M.allRosters(); return; }
  const f = e.target.closest("[data-f]"); if (f) { filt = f.dataset.f; drawerHTML(); requestAnimationFrame(markScrollers); return; }
  const st = e.target.closest("[data-streamtoggle]");
  if (st) { e.preventDefault(); STREAM_HIDE = !STREAM_HIDE; draw(); return; }
  const o = e.target.closest("[data-open]"); if (o) { if (M.DOORS.some(x => x.key === o.dataset.open)) { openKey = o.dataset.open; draw(); } ui.closeAll(); return; }
  if (e.target.closest("button") || e.target.closest(".sheet")) return;
  const d = e.target.closest("[data-door]"); if (d && d.dataset.door !== openKey) { openKey = d.dataset.door; draw(); }
});
load(ui.key(), ui.fmt());
</script></body></html>
