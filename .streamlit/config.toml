[theme]
# THE WARM PALETTE, from design_system.TOKENS (#173). Until 2026-09-06 this file themed every
# native Streamlit widget in a cool grey with an emerald primaryColor, while the embedded
# Draft Room board and app.py's own <style> block were warm near-black under gold -- two
# palettes meeting at an iframe edge, and the "Debate This Pick" primary button rendering in
# emerald, a hue that MEANS "value surplus / good" everywhere else in the app, spent on chrome.
# Every colour below is a TOKENS value verbatim; test_design_system pins that. Gold is the
# primary because a primary button is USER action, which is the one non-brand job gold is
# allowed (owner's ruling recorded at TOKENS["amber"]); its label is painted in `bg` by
# app.py's <style> block, since white on gold is 2.3:1 and bg on gold is 7.6:1.
base = "dark"
primaryColor = "#d4a017"
backgroundColor = "#15120b"
secondaryBackgroundColor = "#1f1a11"
textColor = "#ece3d2"
borderColor = "#3f3522"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = false
showSidebarBorder = true

# A body/UI face with some warmth (Inter), a heading face with a bit more
# character for a "command center" feel (Space Grotesk), and a cleaner
# monospace for the debate transcripts and code than the previous default
# (JetBrains Mono). Loaded straight from Google Fonts via the "name:url"
# theme-font syntax Streamlit supports natively.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

# The roster/free-agent tables get a header band and a border in the same warm tones as
# every other surface, not Streamlit's light-theme grid lines.
dataframeBorderColor = "#3f3522"
dataframeHeaderBackgroundColor = "#1a1610"

[theme.sidebar]
# A touch darker than the main content so the sidebar reads as its own recessed panel rather
# than a fused continuation of the page -- surface-2 is the recessed tone TOKENS already has.
backgroundColor = "#1a1610"
secondaryBackgroundColor = "#1f1a11"
borderColor = "#2c2517"

[browser]
gatherUsageStats = false
